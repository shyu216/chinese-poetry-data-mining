<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中华诗词库 - 三十万首诗词数据挖掘</title>

    <!-- 首屏绘制前设定主题，避免深浅色闪烁 (FOUC) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cpdm-theme');
          var mode = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var root = document.documentElement;
          root.setAttribute('data-theme', mode);
          root.style.colorScheme = mode;
        } catch (e) { /* 忽略：storage 不可用时回退到 CSS 默认 */ }
      })();
    </script>
    
    <!-- DNS预解析和预连接 -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    
    <!-- CDN资源预加载 -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/vue@3.5.29/dist/vue.global.min.js" as="script" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/vue-router@4.6.4/dist/vue-router.global.min.js" as="script" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/naive-ui@2.44.1/dist/index.min.js" as="script" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@vueuse/core@14.2.1/index.iife.min.js" as="script" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" as="script" crossorigin>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js" as="script" crossorigin>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
